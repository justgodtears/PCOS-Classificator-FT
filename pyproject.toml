[project]
name = "pcos-ft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "justgodtears", email = "oopyrchal@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
  "imagehash>=4.3.2",
  "pandas>=3.1.1",
  "peft>=0.21.2",
  "pillow>=13.0.0",
  "scikit-learn>=1.9.1",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "transformers>=5.22.1",
]

[project.scripts]
pcos-ft = "pcos_ft:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = {index = "pytorch-cu132"}

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
